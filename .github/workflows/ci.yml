name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run repository checks
        run: node scripts/check.js

      - name: Behavior tests
        run: npm test

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Behavior tests on Windows
        run: npm test
      - name: Real Electron launch, IPC and persistence
        run: npm run test:electron
      - name: Save Windows screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-screenshots
          path: test-results/*.png
          if-no-files-found: warn
