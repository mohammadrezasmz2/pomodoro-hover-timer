name: Publish requested v1.7.4 once
# Temporary helper for this one approved release, on an isolated branch.
# The source commit and version are fixed; no future versions can be published.
# This file is removed after the release is available.
on:
  push:
    branches: ['publish/v1.7.4']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the approved v1.7.4 commit
        uses: actions/checkout@v7
        with:
          ref: ce909172981e8090c23f38c9b7152d19ff8fd371

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify the exact release target
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'ce909172981e8090c23f38c9b7152d19ff8fd371') { throw "Unexpected source commit." }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '1.7.4') { throw "This helper only publishes v1.7.4." }

      - name: Validate source
        run: node scripts/check.js

      - name: Behavior tests
        run: npm test

      - name: Build the Windows package
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Keep the built package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: pomodoro-timing-v1.7.4-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish v1.7.4 without changing existing releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.7.4'
          $target = 'ce909172981e8090c23f38c9b7152d19ff8fd371'
          $assets = @(
            (Join-Path $PWD 'dist/Pomodoro-Timing-1.7.4-Windows-x64.zip'),
            (Join-Path $PWD 'dist/Pomodoro-Timing-1.7.4-Windows-x64.zip.sha256')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Expected release asset is missing." }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v1.7.4 is already published; no changes made."; exit 0 }
          $existingTag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingTag -ne $target) { throw "Existing tag points to a different commit." }
          gh release create $tag $assets --target $target --title 'Pomodoro Timing 1.7.4' --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
