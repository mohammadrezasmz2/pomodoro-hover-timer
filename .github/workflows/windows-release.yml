name: Windows Build / Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate source
        run: node scripts/check.js

      - name: Behavior tests
        run: npm test

      - name: Build portable Windows ZIP
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pomodoro-timing-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "No release assets found." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --generate-notes --verify-tag
          }
